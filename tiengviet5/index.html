 + card("Gợi ý ôn thông minh",`<div class="list">${skills.map(s=>{const st=stats[s]||{total:0,correct:0};const pct=st.total?Math.round(st.correct/st.total*100):0;let msg=st.total<5?"Chưa đủ dữ liệu. Hãy luyện thêm ít nhất 5 câu.":pct>=85?"Tốt. Duy trì bằng đề tổng hợp.":pct>=65?"Ổn nhưng cần xem lại lỗi sai.":"Cần ưu tiên luyện chủ điểm này.";return `<div class="item"><b>${s}</b><br>${msg}</div>`}).join('')}</div>`);
}
function daily(){return card("Luyện nhanh 5 phút",`<p class="lead">10 câu trộn. Phù hợp ôn hằng ngày trước khi đi ngủ hoặc trước giờ học.</p><div class="actions"><button class="btn" onclick="startQuiz('daily',sample(DATA.questions,10))">Bắt đầu lượt hôm nay</button><button class="btn secondary" onclick="startQuiz('daily-hard',sample(DATA.questions.filter(q=>q.level==='Khó'),10))">Lượt khó</button><button class="btn ghost" onclick="startWeakQuiz()">Luyện điểm yếu</button></div><div id="quizArea"></div>`)}
function startWeakQuiz(){const stats=state.skillStats||{};const skills=["Đọc hiểu","Từ vựng","Từ và câu","Chính tả","Cảm thụ"];let weak=skills[0],score=101;skills.forEach(s=>{const st=stats[s]||{total:0,correct:0};const pct=st.total?st.correct/st.total*100:0;if(pct<score){score=pct;weak=s}});startQuiz('weak',sample(bySkill(weak),12))}
function topics(){const skills=[["Từ vựng","vocab"],["Từ và câu","sentence"],["Chính tả","spell"],["Cảm thụ","rhetoric"],["Đọc hiểu","readskill"]];return card("Kho chủ điểm",`<p class="lead">Chọn từng chủ điểm để luyện sâu. Đáp án được xáo trộn mỗi lượt.</p><div class="two">${skills.map(s=>`<div class="item"><b>${s[0]}</b><br><span class="small">${bySkill(s[0]).length} câu có giải thích</span><div class="actions"><button class="btn" onclick="startQuiz('${s[1]}',sample(bySkill('${s[0]}'),15))">Luyện 15 câu</button></div></div>`).join('')}</div><div id="quizArea"></div>`)
+card("Ma trận chủ điểm",`<table class="table"><tr><th>Mảng</th><th>Cần nắm</th><th>Dạng thi</th></tr><tr><td>Từ vựng</td><td>Từ ghép, từ láy, đồng nghĩa, trái nghĩa, nhiều nghĩa, đồng âm, sắc thái từ</td><td>Chọn từ đúng, giải nghĩa trong ngữ cảnh, tìm nhóm từ</td></tr><tr><td>Từ và câu</td><td>Chủ ngữ, vị ngữ, trạng ngữ, câu ghép, quan hệ từ, chữa câu</td><td>Xác định thành phần, sửa lỗi, nối vế câu</td></tr><tr><td>Cảm thụ</td><td>So sánh, nhân hóa, điệp từ, từ gợi hình/gợi âm</td><td>Nêu tác dụng, cảm nhận hình ảnh đẹp</td></tr><tr><td>Viết</td><td>Câu chủ đề, chi tiết, liên kết, cảm xúc, kết đoạn</td><td>Viết đoạn 5-7 câu, cảm thụ ngắn, nghị luận mini</td></tr></table>`);
}
function reading(){const opts=DATA.readingPassages.map((p,i)=>`<option value="${i}">${i+1}. ${p.title} - ${p.level} - ${p.theme}</option>`).join('');return card("Reading Lab - Đọc hiểu như thám tử",`<p class="lead">Mỗi bài đọc có câu hỏi và giải thích. Trước khi làm, con cần tìm nhân vật/sự vật chính, chi tiết quan trọng, thông điệp.</p><div class="toolbar"><select id="passageSelect">${opts}</select><button class="btn" onclick="loadPassage()">Mở bài đọc</button><button class="btn secondary" onclick="randomPassage()">Bốc bài ngẫu nhiên</button><button class="btn ghost" onclick="filterHardReading()">Bài khó</button></div><div id="passageArea"></div>`)}
function loadPassage(){showPassage(+document.getElementById('passageSelect').value)}
function randomPassage(){const idx=Math.floor(Math.random()*DATA.readingPassages.length);document.getElementById('passageSelect').value=idx;showPassage(idx)}
function filterHardReading(){const hard=DATA.readingPassages.map((p,i)=>[p,i]).filter(x=>x[0].level==='Khó');const idx=hard[Math.floor(Math.random()*hard.length)][1];document.getElementById('passageSelect').value=idx;showPassage(idx)}
function showPassage(idx){const p=DATA.readingPassages[idx];document.getElementById('passageArea').innerHTML=`<div class="item"><span class="tag">${p.level}</span><span class="tag">${p.theme}</span><h3>${p.title}</h3><div class="passage">${p.text}</div><div class="note" style="margin-top:10px"><b>Nhiệm vụ trước khi làm câu hỏi</b><br>1. Tìm nhân vật/sự vật chính. 2. Gạch 3 chi tiết quan trọng. 3. Đoán thông điệp. 4. Khoanh từ phủ định nếu có.</div><div class="actions"><button class="btn" onclick="startQuiz('reading-${p.id}',DATA.readingPassages[${idx}].questions.map(x=>({q:x[0],choices:x[1],answer:x[2],explain:x[3],skill:'Đọc hiểu',level:'${p.level}',subtype:'đọc hiểu'})))">Làm câu hỏi bài này</button></div><div id="quizArea"></div></div>`}
function quizHome(){return card("Drill phản xạ",`<p class="lead">Chế độ luyện nhanh để tạo phản xạ thi. Mỗi lượt đều xáo câu và xáo đáp án.</p><div class="four"><div class="item"><b>1 phút phá đảo</b><br><span class="small">8 câu ngắn</span><div class="actions"><button class="btn" onclick="startQuiz('quiz',sample(DATA.questions,8))">Chơi</button></div></div><div class="item"><b>Boss đọc hiểu</b><br><span class="small">1 bài đọc khó</span><div class="actions"><button class="btn" onclick="bossReading()">Chơi</button></div></div><div class="item"><b>Sửa lỗi câu</b><br><span class="small">Tập trung từ và câu</span><div class="actions"><button class="btn" onclick="startQuiz('quiz',sample(bySkill('Từ và câu'),12))">Chơi</button></div></div><div class="item"><b>Săn chính tả</b><br><span class="small">s/x, ch/tr, r/d/gi</span><div class="actions"><button class="btn" onclick="startQuiz('quiz',sample(bySkill('Chính tả'),12))">Chơi</button></div></div></div><div id="quizArea"></div>`)}
function bossReading(){const hard=DATA.readingPassages.filter(p=>p.level==="Khó");const p=sample(hard,1)[0];startQuiz('quiz',p.questions.map(x=>({q:x[0],choices:x[1],answer:x[2],explain:x[3],skill:'Đọc hiểu',level:p.level,subtype:'đọc hiểu'})))}
function writing(){const list=DATA.writingPrompts.map((w,i)=>`<option value="${i}">${i+1}. ${w.type}: ${w.prompt.slice(0,76)}</option>`).join('');return card("Writing Studio - Luyện viết từng bước",`<p class="lead">Con luyện từ câu hay đến đoạn 5-7 câu. Có checklist để tự rà soát trước khi lưu.</p><div class="toolbar"><select id="writeSelect">${list}</select><button class="btn" onclick="loadWriting()">Mở đề viết</button><button class="btn secondary" onclick="randomWriting()">Bốc đề</button></div><div id="writingArea"></div>`)
+card("Checklist tự rà soát bài viết",`<div class="list"><label class="item"><input type="checkbox"> Có câu chủ đề rõ.</label><label class="item"><input type="checkbox"> Có ít nhất 2 chi tiết cụ thể.</label><label class="item"><input type="checkbox"> Có cảm xúc hoặc nhận xét của em.</label><label class="item"><input type="checkbox"> Không lặp từ quá nhiều.</label><label class="item"><input type="checkbox"> Câu cuối có kết lại ý.</label></div>`)}
function loadWriting(){showWriting(+document.getElementById('writeSelect').value)}
function randomWriting(){const idx=Math.floor(Math.random()*DATA.writingPrompts.length);document.getElementById('writeSelect').value=idx;showWriting(idx)}
function showWriting(idx){const w=DATA.writingPrompts[idx];document.getElementById('writingArea').innerHTML=`<div class="item"><span class="tag">${w.type}</span><h3>${w.prompt}</h3><div class="note"><b>Gợi ý</b><br>${w.hint}</div><textarea id="studentWriting" placeholder="Con viết bài ở đây..."></textarea><div class="actions"><button class="btn" onclick="saveWriting(${idx})">Lưu bài viết</button><button class="btn secondary" onclick="toggleSample()">Xem đoạn mẫu/gợi ý</button><button class="btn ghost" onclick="countWriting()">Đếm chữ</button></div><div id="wordCount" class="small"></div><div id="sampleBox" class="explain hidden">${w.sample}</div></div>`}
function toggleSample(){document.getElementById('sampleBox').classList.toggle('hidden')}
function countWriting(){const t=document.getElementById('studentWriting').value.trim();const words=t?t.split(/\s+/).length:0;document.getElementById('wordCount').textContent=`Bài hiện có khoảng ${words} từ.`}
function saveWriting(idx){const text=document.getElementById('studentWriting').value.trim();if(!text){alert("Con hãy viết một đoạn trước đã.");return}state.writing.push({idx,text,date:new Date().toLocaleString('vi-VN')});state.points+=15;markDone('writing');save();alert("Đã lưu bài viết. Con được cộng 15 điểm.")}
function exam(){return card("Đề thi thử",`<p class="lead">Đề được trộn từ ngân hàng câu hỏi. Sau mỗi đề, app lưu thống kê vào Radar năng lực.</p><div class="three"><div class="item"><b>Đề mini</b><br>15 câu · 10-15 phút<div class="actions"><button class="btn" onclick="startQuiz('exam',sample(DATA.questions,15))">Làm đề</button></div></div><div class="item"><b>Đề tiêu chuẩn</b><br>25 câu · 30-35 phút<div class="actions"><button class="btn" onclick="startQuiz('exam',sample(DATA.questions,25))">Làm đề</button></div></div><div class="item"><b>Đề nâng cao</b><br>25 câu khó<div class="actions"><button class="btn violet" onclick="startQuiz('exam',sample(DATA.questions.filter(q=>q.level==='Khó'),25))">Làm đề</button></div></div></div><div id="quizArea"></div>`)
+card("Cấu trúc đề thi mô phỏng",`<table class="table"><tr><th>Phần</th><th>Tỉ trọng</th><th>Mục tiêu</th></tr><tr><td>Đọc hiểu</td><td>35-45%</td><td>Nắm ý, suy luận, từ trong ngữ cảnh, thông điệp</td></tr><tr><td>Từ và câu</td><td>30-40%</td><td>Từ vựng, ngữ pháp, câu ghép, quan hệ từ, chữa câu</td></tr><tr><td>Cảm thụ</td><td>10-15%</td><td>Biện pháp tu từ, tác dụng hình ảnh</td></tr><tr><td>Viết</td><td>15-25%</td><td>Viết đoạn, cảm nghĩ, nghị luận mini</td></tr></table>`)
}
function tips(){return card("Mẹo nhớ và chiến thuật làm bài",`<p class="lead">Đọc 5 mẹo trước khi luyện. Khi sai, quay lại xem mẹo tương ứng.</p><div class="actions"><button class="btn" onclick="showRandomTips()">Bốc 5 mẹo hôm nay</button><button class="btn secondary" onclick="showAllTips()">Xem tất cả</button></div><div id="tipsArea" class="list">${DATA.tips.slice(0,20).map((t,i)=>`<div class="item"><b>${i+1}.</b> ${t}</div>`).join('')}</div>`)}
function showRandomTips(){document.getElementById('tipsArea').innerHTML=sample(DATA.tips,5).map((t,i)=>`<div class="item"><b>${i+1}.</b> ${t}</div>`).join('')}
function showAllTips(){document.getElementById('tipsArea').innerHTML=DATA.tips.map((t,i)=>`<div class="item"><b>${i+1}.</b> ${t}</div>`).join('')}
function mistakes(){const ms=state.mistakes||[],ws=state.writing||[];return card("Sổ lỗi sai",`<p class="lead">Mỗi câu sai được lưu lại. Đây là khu vực cần xem sau khi làm đề.</p><div class="actions"><button class="btn secondary" onclick="clearMistakes()">Xóa lỗi sai</button><button class="btn" onclick="reviewMistakes()">Ôn lại lỗi sai</button><button class="btn ghost" onclick="exportProgress()">Xuất tiến độ</button></div><h3>Lỗi trắc nghiệm</h3><div class="list">${ms.length?ms.slice().reverse().map((m,i)=>`<div class="item"><b>${i+1}. ${m.skill}</b><br>${m.q}<br><span class="small">Mẹo: ${m.explain}</span></div>`).join(''):'<div class="note">Chưa có lỗi sai nào. Con hãy luyện một lượt trước.</div>'}</div><h3>Bài viết đã lưu</h3><div class="list">${ws.length?ws.slice().reverse().map((w,i)=>`<div class="item"><b>${i+1}. ${w.date}</b><br>${w.text.replace(/</g,'&lt;').slice(0,700)}</div>`).join(''):'<div class="note">Chưa lưu bài viết nào.</div>'}</div>`)
+card("Lỗi thường gặp",`<div class="list">${DATA.errors.map((e,i)=>`<div class="item"><b>${i+1}. ${e[0]}</b><br><span class="small">${e[1]}</span></div>`).join('')}</div>`)}
function clearMistakes(){if(confirm("Xóa toàn bộ lỗi sai?")){state.mistakes=[];save();render()}}
function reviewMistakes(){if(!state.mistakes.length){alert("Chưa có lỗi sai để ôn lại.");return}const qs=state.mistakes.slice(-15).map(m=>({q:m.q,choices:m.choices,answer:m.answer,explain:m.explain,skill:m.skill,level:m.level||"Vừa",subtype:m.subtype||""}));go('daily');setTimeout(()=>startQuiz('review',qs),100)}
function exportProgress(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tien_do_on_tieng_viet_bip.json';a.click();URL.revokeObjectURL(url)}
function startQuiz(key,qs){currentQuiz=shuffle(qs).map(prepareQuestion);currentIndex=0;currentScore=0;locked=false;quizSkillLog={};markDone(key.includes('daily')?'daily':key.includes('exam')?'exam':key.includes('reading')?'reading':key==='vocab'?'vocab':'quiz');renderQuiz()}
function renderQuiz(){const area=document.getElementById('quizArea')||document.querySelector('#main');if(!currentQuiz||!currentQuiz.length){area.innerHTML='<div class="note">Chưa có câu hỏi.</div>';return}if(currentIndex>=currentQuiz.length){const pct=Math.round(currentScore/currentQuiz.length*100);let msg=pct>=85?"Xuất sắc. Con có phản xạ rất tốt.":pct>=65?"Ổn. Cần xem lại lỗi sai để chắc hơn.":"Cần luyện lại các chủ điểm sai nhiều.";state.history=state.history||[];state.history.push({date:new Date().toLocaleString('vi-VN'),score:currentScore,total:currentQuiz.length,pct});save();area.innerHTML=`<div class="card"><h2>Hoàn thành</h2><div class="kpis"><div class="kpi"><b>${currentScore}/${currentQuiz.length}</b><span>Số câu đúng</span></div><div class="kpi"><b>${pct}%</b><span>Tỉ lệ đúng</span></div><div class="kpi"><b>+${currentScore*5}</b><span>Điểm thưởng</span></div><div class="kpi"><b>${state.streak}</b><span>Chuỗi hiện tại</span></div><div class="kpi"><b>${(state.mistakes||[]).length}</b><span>Lỗi đang lưu</span></div></div><p class="lead">${msg}</p><div class="actions"><button class="btn" onclick="render()">Quay lại</button><button class="btn secondary" onclick="go('mistakes')">Xem sổ lỗi sai</button><button class="btn ghost" onclick="go('dashboard')">Xem radar</button></div></div>`;return}
 const q=currentQuiz[currentIndex];area.innerHTML=`<div class="quizbox"><div class="small">Câu ${currentIndex+1}/${currentQuiz.length} · ${q.skill} · ${q.level||'Vừa'} ${q.subtype?'· '+q.subtype:''}</div><div class="progress"><span style="width:${Math.round(currentIndex/currentQuiz.length*100)}%"></span></div><div class="question">${q.q}</div>${q.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${c.text}</button>`).join('')}<div id="explain"></div></div>`}
function choose(i){if(locked)return;locked=true;const q=currentQuiz[currentIndex];const buttons=[...document.querySelectorAll('.choice')];const chosen=q.choices[i];buttons.forEach((b,idx)=>{if(q.choices[idx].correct)b.classList.add('correct');if(idx===i&&!chosen.correct)b.classList.add('wrong')});updateSkill(q.skill,chosen.correct);if(chosen.correct){currentScore++;state.correct++;state.streak=(state.streak||0)+1;state.points=(state.points||0)+5}else{state.streak=0;state.mistakes=state.mistakes||[];state.mistakes.push({q:q.q,choices:q.choices.map(c=>c.text),answer:q.choices.findIndex(c=>c.correct),explain:q.explain,skill:q.skill,level:q.level,subtype:q.subtype})}save();document.getElementById('explain').innerHTML=`<div class="explain"><b>${chosen.correct?'Đúng rồi.':'Chưa đúng.'}</b><br>${q.explain}</div><div class="actions"><button class="btn" onclick="nextQ()">Câu tiếp theo</button></div>`}
function nextQ(){currentIndex++;locked=false;renderQuiz()}
nav();renderHeader();render();
</script>
</body>
</html>
