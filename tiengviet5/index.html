<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Ôn thi Tiếng Việt lớp 5 lên 6 v2</title>
<style>
:root{--bg:#fff7ed;--panel:#fff;--ink:#2d1b12;--muted:#765b4b;--brand:#f97316;--brand2:#fb923c;--soft:#ffedd5;--line:#fed7aa;--ok:#16a34a;--bad:#dc2626;--warn:#ca8a04;--blue:#2563eb;--violet:#7c3aed}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top left,#ffedd5,transparent 30%),linear-gradient(180deg,#fff7ed,#fffaf5 55%,#fff);color:var(--ink)}
.app{max-width:1240px;margin:0 auto;padding:16px}
.header{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:14px;position:sticky;top:0;background:rgba(255,247,237,.94);backdrop-filter:blur(8px);z-index:5;padding:10px 0;border-bottom:1px solid #fed7aa}
.logo{display:flex;gap:10px;align-items:center}.sun{width:44px;height:44px;border-radius:16px;background:linear-gradient(135deg,#fb923c,#f97316);box-shadow:0 10px 25px #fb923c66;display:grid;place-items:center;color:white;font-weight:900}
h1{font-size:20px;line-height:1.15;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.scorebar{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#fff;border:1px solid var(--line);padding:8px 10px;border-radius:999px;font-weight:800;font-size:12px;color:#5c4033;box-shadow:0 4px 14px #f9731612}
.grid{display:grid;grid-template-columns:290px 1fr;gap:16px}.nav{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:24px;padding:12px;box-shadow:0 12px 30px #f9731614;align-self:start;position:sticky;top:86px}
.nav button{width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:12px;border-radius:16px;font-weight:800;margin:3px 0;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.nav button.active,.nav button:hover{background:linear-gradient(135deg,#ffedd5,#fff7ed);color:#9a3412}.badge{font-size:11px;color:#9a3412;background:#ffedd5;border:1px solid #fed7aa;border-radius:999px;padding:2px 7px}
.card{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:0 14px 34px #f9731612;margin-bottom:16px}.card h2{margin:0 0 8px;font-size:24px}.card h3{margin:8px 0 10px;font-size:18px}.lead{color:var(--muted);line-height:1.55;margin:0 0 14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.btn{border:0;border-radius:16px;padding:11px 14px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand2));color:white;box-shadow:0 9px 18px #f9731633}.btn.secondary{background:#fff;color:#9a3412;border:1px solid var(--line);box-shadow:none}.btn.ghost{background:#fff7ed;color:#7c2d12;box-shadow:none;border:1px dashed #fdba74}.btn.violet{background:linear-gradient(135deg,#7c3aed,#a78bfa)}.btn:disabled{opacity:.55;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{background:#fff7ed;border:1px solid var(--line);border-radius:20px;padding:14px}.kpi b{font-size:24px;display:block;color:#c2410c}.small{font-size:12px;color:var(--muted)}
.path{display:grid;gap:10px}.step{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px}.stepnum{width:36px;height:36px;border-radius:13px;background:#ffedd5;display:grid;place-items:center;font-weight:900;color:#c2410c}.progress{height:10px;background:#ffedd5;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#f97316,#fb923c);width:0}
.quizbox{display:grid;gap:10px}.question{font-size:20px;font-weight:900;line-height:1.35;margin:8px 0}.choice{padding:13px 14px;border:1.5px solid #fed7aa;border-radius:16px;background:#fff;cursor:pointer;text-align:left;font-size:15px}.choice:hover{background:#fff7ed}.choice.correct{border-color:#86efac;background:#f0fdf4;color:#166534}.choice.wrong{border-color:#fecaca;background:#fef2f2;color:#991b1b}.explain{border-left:5px solid #fb923c;background:#fff7ed;border-radius:14px;padding:12px;margin-top:10px;line-height:1.55}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}select,input,textarea{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff;color:var(--ink);font:inherit}textarea{width:100%;min-height:170px;line-height:1.55}
.passage{line-height:1.75;font-size:17px;background:#fffaf5;border:1px solid var(--line);border-radius:18px;padding:16px;white-space:pre-wrap}.tag{display:inline-block;font-size:12px;background:#ffedd5;border:1px solid #fed7aa;color:#9a3412;border-radius:999px;padding:4px 8px;margin:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.four{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.note{background:#fefce8;border:1px solid #fde68a;border-radius:18px;padding:12px;line-height:1.55;color:#713f12}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;line-height:1.5}.item b{color:#9a3412}.hidden{display:none!important}
.table{width:100%;border-collapse:separate;border-spacing:0 8px}.table td,.table th{text-align:left;padding:10px;background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top}.table th{background:#ffedd5;color:#9a3412}.table td:first-child,.table th:first-child{border-left:1px solid var(--line);border-radius:12px 0 0 12px}.table td:last-child,.table th:last-child{border-right:1px solid var(--line);border-radius:0 12px 12px 0}
.radar{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.barrow{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px}.barrow .progress{margin-top:6px}.footer{font-size:12px;color:var(--muted);text-align:center;padding:22px}
@media(max-width:900px){.app{padding:10px}.grid{grid-template-columns:1fr}.nav{position:static;display:grid;grid-template-columns:1fr 1fr}.header{align-items:flex-start}.scorebar{justify-content:flex-start}.kpis{grid-template-columns:repeat(2,1fr)}.three,.four,.two,.radar{grid-template-columns:1fr}.card{border-radius:20px;padding:14px}.question{font-size:18px}.nav button{font-size:13px;padding:10px}}
@media(max-width:560px){.nav{grid-template-columns:1fr}.header{display:block}.scorebar{margin-top:10px}.actions .btn{width:100%}.kpis{grid-template-columns:1fr}}
</style>
</head>

<script>
const DATA = {"readingPassages": [{"id": "p01", "level": "Dễ", "theme": "Gia đình", "title": "Chiếc hộp bút của bà", "text": "Sáng thứ hai, Minh mở cặp và thấy chiếc hộp bút gỗ đã cũ nằm ngay ngắn bên cạnh vở Tiếng Việt. Đó là món quà bà ngoại tặng em trước ngày vào lớp Năm. Hộp bút không sáng bóng như những món đồ mới, nhưng trên nắp có khắc một bông cúc nhỏ. Mỗi khi mở hộp, Minh lại nghe mùi gỗ thoang thoảng và nhớ đến đôi bàn tay nhăn nheo của bà. Hôm kiểm tra, chiếc bút chì trong hộp bị gãy đầu. Minh hơi luống cuống, nhưng rồi em nhớ lời bà: “Việc khó thì làm chậm lại, đừng làm rối mình thêm.” Minh bình tĩnh gọt bút và tiếp tục làm bài. Tan học, Minh đặt hộp bút lên bàn học, lau nhẹ vết bụi trên nắp. Em chợt hiểu: có những món quà không chỉ để dùng, mà còn để nhắc ta sống vững vàng hơn.", "questions": [["Chiếc hộp bút của Minh có đặc điểm gì?", ["Làm bằng gỗ và có khắc bông cúc nhỏ", "Làm bằng nhựa trong suốt", "Có đèn phát sáng", "Được mua ở hội chợ"], 0, "Chi tiết trực tiếp trong bài: hộp bút gỗ, trên nắp khắc bông cúc nhỏ."], ["Lời bà giúp Minh điều gì?", ["Bình tĩnh xử lý khi gặp việc khó", "Làm bài nhanh hơn mọi bạn", "Mượn đồ của bạn", "Bỏ qua câu khó"], 0, "Lời bà nhắc Minh chậm lại và không rối lên."], ["Ý nghĩa sâu hơn của chiếc hộp bút là gì?", ["Nhắc Minh sống vững vàng hơn", "Giúp Minh nổi bật", "Làm bài tự động đúng", "Thay thế mọi đồ dùng"], 0, "Kết bài nêu rõ món quà nhắc ta sống vững vàng hơn."], ["Từ “thoang thoảng” gợi cảm giác gì?", ["Mùi nhẹ, không nồng", "Âm thanh rất lớn", "Màu sắc rực rỡ", "Cảm giác đau"], 0, "Thoang thoảng thường chỉ mùi hương nhẹ."], ["Nhan đề khác phù hợp nhất là gì?", ["Món quà nhỏ của bà", "Ngày hội thể thao", "Chiếc cặp mới", "Bài toán khó"], 0, "Bài xoay quanh hộp bút và ý nghĩa món quà của bà."]]}, {"id": "p02", "level": "Dễ", "theme": "Thiên nhiên", "title": "Cơn mưa đầu hạ", "text": "Buổi chiều, bầu trời bỗng chuyển màu xám bạc. Những đám mây kéo đến từ phía cuối phố như một đàn trâu chậm rãi. Gió thổi qua hàng sấu, làm lá cây xào xạc. Rồi mưa rơi. Ban đầu chỉ là vài giọt lách tách trên mái hiên, sau đó mưa đổ xuống ào ào. Con đường trước nhà Lan loáng nước, những chiếc lá khô xoay tròn trong dòng chảy nhỏ. Lan đứng bên cửa sổ, nhìn cây cối như được tắm gội sau nhiều ngày nắng gắt. Mưa không kéo dài lâu. Khi trời hửng sáng, từng giọt nước còn đọng trên lá, trong veo như những hạt thủy tinh. Lan thấy lòng mình nhẹ bẫng. Em mở vở, viết một câu: “Cơn mưa đã làm thành phố dịu lại.”", "questions": [["Hình ảnh “như một đàn trâu chậm rãi” là biện pháp gì?", ["So sánh", "Nhân hóa", "Điệp ngữ", "Nói quá"], 0, "Có từ “như” để ví đám mây với đàn trâu."], ["Mưa giúp cây cối như thế nào?", ["Như được tắm gội sau nhiều ngày nắng gắt", "Rụng hết lá", "Bị khô héo", "Không thay đổi"], 0, "Bài nói cây cối như được tắm gội."], ["Cụm “hạt thủy tinh” gợi vẻ đẹp gì?", ["Trong veo, lấp lánh", "Nặng nề, xám xịt", "Khô ráp", "Ồn ào"], 0, "Giọt nước được tả trong veo."], ["Cảm xúc của Lan sau cơn mưa là gì?", ["Nhẹ bẫng, dễ chịu", "Sợ hãi", "Tức giận", "Buồn bã"], 0, "Bài nói Lan thấy lòng nhẹ bẫng."], ["Ý câu “Cơn mưa đã làm thành phố dịu lại” là gì?", ["Mưa làm không khí và lòng người dễ chịu hơn", "Mưa làm thành phố biến mất", "Mưa khiến mọi người không thể học", "Mưa làm cây ngừng lớn"], 0, "Câu này vừa tả thời tiết, vừa gợi cảm xúc."]]}, {"id": "p03", "level": "Vừa", "theme": "Trường học", "title": "Người trực nhật cuối cùng", "text": "Hôm ấy lớp 5A tan học muộn vì chuẩn bị cho buổi triển lãm sách. Khi các bạn đã ra về, An quay lại lớp để lấy áo khoác. Em thấy dưới sàn còn vương những mẩu giấy nhỏ, trên bảng vẫn còn vài dòng phấn. An đứng một lúc. Theo lịch, hôm đó không phải lượt trực nhật của em. Nhưng nhìn căn phòng bừa bộn, An nghĩ đến cô lao công thường đi qua hành lang lúc trời đã tối. Em đặt cặp xuống, nhặt từng mẩu giấy, xếp lại chồng ghế và lau bảng. Công việc không nhiều, nhưng làm một mình nên khá lâu. Khi An khóa cửa lớp, sân trường chỉ còn ánh đèn vàng. Sáng hôm sau, cô giáo hỏi ai đã dọn lớp. An im lặng. Bạn lớp trưởng nhìn quanh rồi nói: “Có lẽ đó là người yêu lớp mình nhất.” An cúi xuống, mỉm cười rất khẽ.", "questions": [["Vì sao An quay lại lớp?", ["Để lấy áo khoác", "Để gặp cô giáo", "Để mượn sách", "Để chơi bóng"], 0, "Chi tiết nằm ở đầu văn bản."], ["Theo lịch, hôm đó An có phải trực nhật không?", ["Không", "Có", "Không rõ", "An luôn phải trực"], 0, "Bài nói rõ hôm đó không phải lượt trực nhật của An."], ["Điều gì khiến An quyết định dọn lớp?", ["Nghĩ đến cô lao công và thấy lớp bừa bộn", "Sợ bị phạt", "Muốn được khen", "Bạn ép làm"], 0, "Đây là nguyên nhân sâu hơn trong bài."], ["Hành động im lặng của An cho thấy em là người như thế nào?", ["Khiêm tốn, làm việc tốt không cần khoe", "Nhút nhát và sợ cô", "Không nhớ mình đã làm gì", "Không thích lớp"], 0, "An không nhận công, chỉ mỉm cười."], ["Thông điệp chính là gì?", ["Việc tốt thầm lặng rất đáng quý", "Trực nhật là việc nặng nhất", "Nên về nhà thật sớm", "Không cần giữ lớp sạch"], 0, "Câu chuyện ca ngợi trách nhiệm âm thầm."]]}, {"id": "p04", "level": "Vừa", "theme": "Bạn bè", "title": "Chiếc thước kẻ gãy", "text": "Trong giờ Mĩ thuật, Huy làm rơi chiếc thước kẻ của Nam. Chiếc thước gãy làm đôi. Huy đỏ mặt, vội nói xin lỗi, nhưng Nam vẫn cau có suốt buổi. Tan học, Huy lấy từ cặp ra một chiếc thước mới, đặt lên bàn Nam. Nam nhìn chiếc thước, rồi nhìn mảnh thước gãy còn nằm trong ngăn bàn. Cậu bỗng nhớ ra: sáng nay chính mình đã đặt thước ở mép bàn, nơi rất dễ rơi. Nam im lặng một lát rồi đẩy chiếc thước mới lại cho Huy. “Cậu không phải mua đâu. Tớ cũng có lỗi.” Huy ngạc nhiên. Hai bạn cùng nhặt mảnh thước gãy, rồi bật cười vì trên đó vẫn còn dòng chữ Nam đã viết: “Đồ dùng học tập phải được giữ gìn.” Từ hôm ấy, Nam không còn đặt thước ở mép bàn nữa.", "questions": [["Phản ứng ban đầu của Nam là gì?", ["Cau có suốt buổi", "Cười lớn", "Không quan tâm", "Tặng Huy thước mới"], 0, "Nam cau có vì thước gãy."], ["Vì sao Nam không nhận chiếc thước mới?", ["Nam nhận ra mình cũng có lỗi", "Nam không thích màu thước", "Nam đã có nhiều thước", "Nam muốn Huy bị phạt"], 0, "Nam nhớ mình đã đặt thước ở mép bàn."], ["Câu “Đồ dùng học tập phải được giữ gìn” tạo hiệu quả gì?", ["Vừa nhắc nhở, vừa tạo chút hài hước", "Làm câu chuyện đáng sợ", "Chứng minh Huy cố ý", "Không có ý nghĩa"], 0, "Dòng chữ đối chiếu với sự bất cẩn."], ["Nam thay đổi điều gì sau sự việc?", ["Không đặt thước ở mép bàn nữa", "Không dùng thước nữa", "Không học Mĩ thuật", "Không nói chuyện với Huy"], 0, "Chi tiết ở câu cuối."], ["Bài học phù hợp nhất là gì?", ["Biết nhận lỗi giúp tình bạn nhẹ nhàng hơn", "Bạn bè không cần xin lỗi", "Đồ dùng hỏng thì giấu đi", "Chỉ người làm rơi mới có lỗi"], 0, "Câu chuyện nhấn mạnh biết nhận lỗi."]]}, {"id": "p05", "level": "Khó", "theme": "Đọc sách", "title": "Trang sách có dấu gấp", "text": "Thư viện trường mới được sơn lại, các giá sách thơm mùi gỗ. Mai thích nhất góc truyện lịch sử, nơi có chiếc bàn nhỏ đặt cạnh cửa sổ. Một chiều, em mượn cuốn sách kể về những nhà thám hiểm. Khi mở đến giữa sách, Mai thấy một góc trang bị gấp lại. Em hơi khó chịu. Với Mai, sách giống như một người bạn, mà bạn thì không nên bị làm đau. Em định vuốt phẳng trang sách rồi đọc tiếp, nhưng dưới nếp gấp có một dòng bút chì mờ: “Đoạn này làm tớ muốn đi xa hơn.” Mai đọc lại đoạn văn phía trên. Đó là cảnh nhân vật chính đứng trước biển, vừa sợ hãi vừa khao khát khám phá. Bỗng nhiên, Mai không còn chỉ thấy một lỗi nhỏ trong cách giữ sách. Em thấy phía sau dấu gấp là một bạn đọc nào đó đã từng xúc động. Mai vuốt trang sách thật nhẹ, rồi ghi vào sổ tay của mình: “Đọc sách không chỉ là hiểu chữ, mà còn gặp những trái tim khác.”", "questions": [["Ban đầu Mai cảm thấy thế nào khi thấy trang sách bị gấp?", ["Hơi khó chịu", "Rất vui", "Hoảng sợ", "Không để ý"], 0, "Bài nêu Mai hơi khó chịu."], ["Vì sao Mai thay đổi cách nhìn về dấu gấp?", ["Vì thấy dòng bút chì của một bạn đọc từng xúc động", "Vì cô thủ thư yêu cầu", "Vì trang sách tự phẳng lại", "Vì cuốn sách rất mới"], 0, "Dòng bút chì giúp Mai hiểu cảm xúc của người đọc trước."], ["Câu “sách giống như một người bạn” dùng biện pháp gì?", ["So sánh", "Điệp ngữ", "Đảo ngữ", "Nói quá"], 0, "Sách được ví với người bạn."], ["Câu cuối cho thấy Mai hiểu điều gì?", ["Đọc sách còn là sự gặp gỡ cảm xúc giữa người đọc", "Đọc sách chỉ để lấy điểm", "Sách cũ không đáng đọc", "Không nên đọc sách có dấu gấp"], 0, "Mai nhận ra phía sau trang sách có trái tim của người đọc khác."], ["Từ “khao khát” gần nghĩa nhất với từ nào?", ["Mong muốn mãnh liệt", "Lo lắng nhẹ", "Chán nản", "Bối rối"], 0, "Khao khát là mong muốn mạnh mẽ."]]}, {"id": "p06", "level": "Khó", "theme": "Trách nhiệm", "title": "Bản đồ lớp học", "text": "Đầu năm, cô giáo treo một tấm bản đồ lớp học lên bảng tin. Trên bản đồ không có núi sông, chỉ có những chiếc ghế nhỏ được vẽ bằng bút màu. Mỗi khi một bạn làm được việc tốt, cô dán một ngôi sao bé xíu cạnh tên bạn. Lúc đầu, cả lớp rất hào hứng. Nhưng sau vài tuần, nhiều bạn chỉ làm việc tốt khi cô có mặt. Riêng Phúc vẫn lặng lẽ kê lại ghế, nhắc bạn tắt quạt, nhặt giấy dưới chân bàn. Một hôm, cô giáo tháo bản đồ xuống. Cả lớp xôn xao. Cô mỉm cười: “Bản đồ thật không nằm trên bảng tin. Nó nằm trong cách các con tự đi qua một ngày của mình.” Từ đó, lớp 5B không còn đếm sao nữa. Nhưng lạ thay, lớp lại gọn gàng hơn trước.", "questions": [["Tấm bản đồ lớp học dùng để làm gì lúc đầu?", ["Ghi nhận việc tốt bằng ngôi sao", "Chỉ đường đi trong trường", "Dạy địa lí", "Trang trí ngày hội"], 0, "Cô dán sao cạnh tên bạn khi bạn làm việc tốt."], ["Vấn đề sau vài tuần là gì?", ["Nhiều bạn chỉ làm việc tốt khi cô có mặt", "Không ai thích ngôi sao", "Bản đồ bị rách", "Cả lớp quên tên"], 0, "Bài nêu rõ điều này."], ["Phúc khác nhiều bạn ở điểm nào?", ["Vẫn lặng lẽ làm việc tốt dù không cần được thấy", "Luôn xin thêm sao", "Không bao giờ nhặt giấy", "Chỉ làm khi được khen"], 0, "Phúc làm việc tốt âm thầm."], ["Câu nói của cô giáo có ý nghĩa gì?", ["Trách nhiệm thật nằm ở ý thức tự giác", "Bản đồ bị treo sai chỗ", "Cần mua bản đồ mới", "Không nên làm việc tốt"], 0, "Cô muốn học sinh hiểu về ý thức tự giác."], ["Thông điệp sâu nhất là gì?", ["Khi có tự giác, con người không cần phần thưởng vẫn làm điều đúng", "Ngôi sao luôn quan trọng nhất", "Lớp học chỉ cần bảng tin đẹp", "Việc tốt phải được công bố"], 0, "Câu chuyện chuyển từ động lực bên ngoài sang ý thức bên trong."]]}, {"id": "p07", "level": "Vừa", "theme": "Quê hương", "title": "Mùi rơm tháng Sáu", "text": "Tháng Sáu, An được về quê ngoại. Con đường làng hẹp, hai bên là những bờ cỏ mềm. Chiều xuống, mùi rơm mới phơi lan nhẹ trong gió. Ngoại bảo: “Mùi này là mùi của mùa gặt.” An chưa từng nghĩ mùi hương cũng có thể giữ lại một mùa. Em theo ngoại ra sân, thấy những bó rơm vàng được xếp thành đống nhỏ. Lũ gà con ríu rít chạy quanh chân mẹ. Xa xa, tiếng máy tuốt lúa đều đều như một nhịp trống chậm. Tối đến, An nằm trên chiếc chõng tre, nghe tiếng dế và nhìn trăng trôi qua mái nhà. Thành phố có nhiều ánh đèn, nhưng ở quê, bóng tối cũng dịu dàng. An thầm nghĩ: có lẽ quê hương không chỉ là nơi ta sinh ra, mà còn là nơi khiến lòng ta trở nên yên tĩnh.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Mùi rơm tháng Sáu” là gì?", ["Quê hương", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p08", "level": "Khó", "theme": "Môi trường", "title": "Cái cây không tên", "text": "Ở góc sân trường có một cái cây không ai biết tên. Nó không nở hoa rực rỡ như bằng lăng, cũng không có tán rộng như phượng. Vì thế, học sinh thường đi ngang qua mà chẳng để ý. Một ngày cuối tháng Tư, trường sửa lại sân. Bác bảo vệ bảo cái cây có thể sẽ bị chặt vì “không có gì đặc biệt”. Nghe vậy, nhóm của Linh quyết định quan sát cây trong một tuần. Các bạn phát hiện chim sẻ thường đậu trên cành cây vào buổi sáng, kiến làm tổ dưới gốc, còn những chiếc lá rụng mục đi làm đất mềm hơn. Linh viết một tờ giấy dán cạnh gốc cây: “Đặc biệt không phải lúc nào cũng có nghĩa là nổi bật.” Tuần sau, khi sân trường được sửa xong, cái cây vẫn đứng đó, im lặng nhưng không còn vô hình.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Cái cây không tên” là gì?", ["Môi trường", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p09", "level": "Vừa", "theme": "Lòng tốt", "title": "Bữa sáng bên cổng trường", "text": "Mỗi sáng, trước cổng trường, bác bán xôi thường đặt thêm một chiếc ghế nhỏ cho học sinh ngồi chờ bố mẹ. Một hôm trời mưa, chiếc ô của Tuấn bị gió lật ngược. Bác gọi em lại, đưa cho em túi nilon bọc vở và bảo đứng nép dưới mái hiên. Tuấn chỉ kịp nói cảm ơn rồi chạy vào lớp. Chiều về, em thấy bác vẫn ngồi đó, áo mưa ướt một bên vai. Tuấn lấy trong cặp ra chiếc khăn giấy còn khô, đưa cho bác. Bác cười: “Thế là hôm nay cả hai bác cháu đều có người che mưa.” Tuấn hiểu rằng lòng tốt đôi khi bắt đầu từ những việc rất nhỏ.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Bữa sáng bên cổng trường” là gì?", ["Lòng tốt", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p10", "level": "Dễ", "theme": "Kiên trì", "title": "Con diều mắc trên cành xoan", "text": "Chiều chủ nhật, con diều của Khoa mắc trên cành xoan cao. Bạn bè bảo bỏ đi vì dây đã rối. Khoa không trèo cây, cũng không giật mạnh. Em ngồi xuống gỡ từng đoạn dây, rồi nhờ bác hàng xóm dùng cây sào khều nhẹ. Mất gần nửa giờ, con diều mới rơi xuống, hơi rách ở một góc. Khoa dán lại bằng mảnh giấy màu xanh. Khi diều bay lên lần nữa, nó không còn đẹp như ban đầu, nhưng Khoa thấy vui hơn. Em nhận ra có những thứ không cần hoàn hảo mới đáng nâng niu; điều quan trọng là mình đã không bỏ cuộc quá sớm.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Con diều mắc trên cành xoan” là gì?", ["Kiên trì", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p11", "level": "Khó", "theme": "Công nghệ", "title": "Chiếc đồng hồ biết im lặng", "text": "Sinh nhật, bố tặng Linh một chiếc đồng hồ thông minh. Nó nhắc giờ học, giờ uống nước, giờ vận động. Mấy ngày đầu, Linh thích thú làm theo mọi tiếng rung. Nhưng rồi em nhận ra mình cứ chờ đồng hồ nhắc mới đứng dậy, mới mở sách, mới nghỉ mắt. Một tối, bố hỏi: “Con dùng đồng hồ, hay đồng hồ đang dùng con?” Linh bật cười, rồi im lặng suy nghĩ. Hôm sau, em tắt bớt thông báo, chỉ giữ những nhắc nhở cần thiết. Chiếc đồng hồ vẫn ở trên tay, nhưng Linh học cách lắng nghe chính mình trước khi nghe máy móc.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Chiếc đồng hồ biết im lặng” là gì?", ["Công nghệ", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p12", "level": "Dễ", "theme": "Sáng tạo", "title": "Bức tranh không có màu xanh", "text": "Trong tiết Mĩ thuật, cô yêu cầu vẽ khu vườn mơ ước. Hộp màu của Vy lại mất bút xanh lá. Em buồn vì nghĩ không thể vẽ cây. Một lúc sau, Vy dùng màu vàng pha với chút nâu để tạo những tán cây mùa thu, dùng màu tím nhạt cho luống hoa và màu cam cho con đường. Khi treo tranh, nhiều bạn dừng lại lâu trước bức tranh của Vy. Cô giáo nói: “Đôi khi thiếu một màu lại mở ra cách nhìn mới.” Vy nhìn hộp màu không trọn vẹn của mình và thấy nó không còn là một rắc rối nữa.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Bức tranh không có màu xanh” là gì?", ["Sáng tạo", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p13", "level": "Vừa", "theme": "Thầy cô", "title": "Viên phấn cuối ngày", "text": "Cuối buổi học, cô giáo nhặt viên phấn nhỏ còn sót lại trên bục giảng. Nam hỏi vì sao cô không bỏ đi. Cô mỉm cười, dùng viên phấn ấy viết lên bảng dòng chữ: “Ngày mai bắt đầu từ hôm nay.” Viên phấn ngắn đến mức cô phải cầm rất khẽ. Nét chữ không thật đều, nhưng cả lớp bỗng im lặng. Nam nhìn viên phấn bé xíu và hiểu rằng có những điều nhỏ vẫn có thể viết nên lời nhắc lớn. Từ hôm ấy, em không còn vứt giấy nháp khi mới dùng một nửa.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Viên phấn cuối ngày” là gì?", ["Thầy cô", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p14", "level": "Khó", "theme": "Dũng cảm", "title": "Lời xin lỗi trước lớp", "text": "Trong buổi thảo luận nhóm, Quân vô tình gạt đi ý kiến của Hà bằng một câu nói vội: “Ý đó đơn giản quá.” Hà im lặng suốt phần còn lại. Tối về, Quân nhớ lại ánh mắt bạn và thấy mình không ổn. Sáng hôm sau, trước khi nhóm bắt đầu trình bày, Quân đứng lên xin lỗi Hà. Lớp học yên lặng vài giây. Hà gật đầu. Bài thuyết trình hôm ấy không phải bài hay nhất, nhưng nhóm Quân làm việc cùng nhau tốt hơn. Quân nhận ra dũng cảm không chỉ là dám nói, mà còn là dám sửa điều mình đã nói sai.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Lời xin lỗi trước lớp” là gì?", ["Dũng cảm", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p15", "level": "Vừa", "theme": "Đọc sách", "title": "Tấm thẻ thư viện", "text": "Ngày nhận thẻ thư viện, Ngọc cẩn thận viết tên mình bằng nét chữ đẹp nhất. Em nghĩ chiếc thẻ chỉ dùng để mượn sách. Nhưng sau một tháng, thẻ thư viện trở thành chiếc vé đưa em đến nhiều nơi: khu rừng trong truyện cổ, đại dương trong sách khoa học, và cả những vùng đất xa trên bản đồ. Mỗi cuốn sách trả lại đều để trong Ngọc một câu hỏi mới. Cô thủ thư bảo: “Một người đọc nhiều không phải vì đã biết đủ, mà vì biết mình còn nhiều điều chưa biết.” Ngọc giữ tấm thẻ trong ngăn cặp như giữ một cánh cửa nhỏ.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Tấm thẻ thư viện” là gì?", ["Đọc sách", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p16", "level": "Dễ", "theme": "Tự lập", "title": "Bữa cơm đầu tiên", "text": "Mẹ về muộn, Phương quyết định tự cắm cơm. Em vo gạo hơi lâu, đong nước chưa thật chuẩn nên cơm mềm hơn mọi ngày. Khi mẹ về, Phương hồi hộp mở nắp nồi. Mẹ nếm thử rồi nói: “Cơm hôm nay có vị của sự cố gắng.” Phương bật cười. Bữa tối không có món gì đặc biệt, nhưng em thấy mình lớn thêm một chút. Từ hôm ấy, mỗi tuần Phương nhận một việc nhỏ trong bếp. Em hiểu tự lập không phải làm việc thật lớn, mà là bắt đầu chịu trách nhiệm với những việc vừa sức.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Bữa cơm đầu tiên” là gì?", ["Tự lập", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p17", "level": "Khó", "theme": "Lịch sử", "title": "Lá cờ trong bảo tàng", "text": "Trong chuyến tham quan bảo tàng, Bình dừng rất lâu trước một lá cờ đã bạc màu. Nó không rực rỡ như những lá cờ trong ngày lễ, mép vải còn sờn và có vài vết vá. Cô hướng dẫn viên kể rằng lá cờ từng được mang qua nhiều trận đánh. Bình nhìn những đường chỉ vá và bỗng thấy chúng giống như những dòng chữ không lời. Lá cờ không cần mới để trang nghiêm. Chính những vết sờn khiến nó kể được nhiều điều hơn. Ra khỏi bảo tàng, Bình đi chậm hơn. Em thấy lịch sử không chỉ nằm trong sách, mà còn nằm trong những vật đã đi qua thời gian.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Lá cờ trong bảo tàng” là gì?", ["Lịch sử", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p18", "level": "Dễ", "theme": "Môi trường", "title": "Ngày không túi nilon", "text": "Lớp 5C tổ chức một ngày không dùng túi nilon. Ban đầu, nhiều bạn quên mang túi vải nên khá lúng túng khi mua đồ ăn sáng. Mai mang theo vài chiếc túi giấy gấp gọn và chia cho các bạn. Đến cuối ngày, thùng rác của lớp nhẹ hơn hẳn. Cô giáo không khen lớp bằng điểm số, mà đặt lên bàn một chậu cây nhỏ. Cô nói: “Mỗi thói quen tốt là một chiếc rễ.” Các bạn nhìn chậu cây và hiểu rằng bảo vệ môi trường không phải điều gì xa vời; nó bắt đầu từ những lựa chọn rất gần trong một ngày bình thường.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Ngày không túi nilon” là gì?", ["Môi trường", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p19", "level": "Vừa", "theme": "Tư duy", "title": "Câu hỏi chưa có đáp án", "text": "Trong tiết Khoa học, cô giáo hỏi: “Vì sao chiếc lá thường có màu xanh?” Nhiều cánh tay giơ lên. Riêng Nam hỏi tiếp: “Nếu cây sống dưới ánh đèn khác màu thì lá có đổi màu không ạ?” Cả lớp cười vì câu hỏi nghe lạ. Cô giáo không cười. Cô viết câu hỏi ấy lên góc bảng và nói: “Một câu hỏi tốt có thể mở thêm một bài học.” Hôm sau, Nam mang đến lớp vài chậu cây nhỏ để thử quan sát. Kết quả chưa rõ ngay, nhưng cả nhóm bắt đầu ghi chép cẩn thận. Nam hiểu rằng học không chỉ là trả lời đúng, mà còn là dám hỏi sâu hơn.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Câu hỏi chưa có đáp án” là gì?", ["Tư duy", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p20", "level": "Khó", "theme": "Kỷ luật", "title": "Chiếc chuông báo thức", "text": "Mỗi sáng, chuông báo thức reo ba lần mà Đức vẫn muốn ngủ thêm. Một hôm, em đến lớp muộn và bỏ lỡ phần kể chuyện đầu giờ. Cô giáo không mắng, chỉ hỏi: “Con có thấy tiếc không?” Đức gật đầu. Tối đó, em đặt đồng hồ xa giường để phải đứng dậy tắt chuông. Những ngày đầu rất khó, nhưng sau một tuần, Đức không còn vội vàng vào buổi sáng. Em nhận ra kỷ luật không phải là điều làm mình mất tự do; nó giúp mình có thêm thời gian cho những điều muốn làm.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Chiếc chuông báo thức” là gì?", ["Kỷ luật", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p21", "level": "Dễ", "theme": "Tình bạn", "title": "Mẩu giấy trong ngăn bàn", "text": "Lan tìm thấy trong ngăn bàn một mẩu giấy ghi lời động viên: “Cố lên, cậu làm được.” Em không biết ai viết, nhưng cả buổi kiểm tra hôm ấy, Lan bình tĩnh hơn. Cuối giờ, Minh thú nhận đã viết vì thấy Lan lo lắng từ sáng. Lan cười, gấp mẩu giấy cất vào hộp bút. Một câu ngắn đôi khi cũng đủ làm người khác mạnh mẽ hơn.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Mẩu giấy trong ngăn bàn” là gì?", ["Tình bạn", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p22", "level": "Vừa", "theme": "Thiên nhiên", "title": "Hoa bằng lăng cuối phố", "text": "Cuối tháng Năm, hàng bằng lăng cuối phố nở tím. Mỗi chiều đi học về, Hân thường đi chậm lại để nhìn những chùm hoa nghiêng xuống vỉa hè. Màu tím ấy không ồn ào như tiếng ve, nhưng làm mùa hè trở nên dịu hơn. Hân nhặt một cánh hoa rơi, ép vào trang vở. Em muốn giữ lại một khoảnh khắc rất nhỏ của tuổi học trò.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Hoa bằng lăng cuối phố” là gì?", ["Thiên nhiên", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p23", "level": "Khó", "theme": "Trách nhiệm", "title": "Bóng đèn hành lang", "text": "Bóng đèn ngoài hành lang lớp 5B bị bật suốt giờ ra chơi. Nhiều bạn đi qua nhưng không ai tắt. Long đang chạy xuống sân thì dừng lại, quay vào lớp và tắt công tắc. Bạn cười: “Tiết kiệm điện cũng là việc của tụi mình.” Việc ấy nhỏ đến mức không ai chấm điểm, nhưng từ hôm đó, nhiều bạn bắt đầu để ý hơn.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Bóng đèn hành lang” là gì?", ["Trách nhiệm", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p24", "level": "Dễ", "theme": "Tự tin", "title": "Bài thuyết trình run rẩy", "text": "Mai cầm tờ giấy, tay hơi run khi đứng trước lớp. Em đọc vấp vài lần, mặt đỏ bừng. Nhưng khi nhìn thấy cô giáo gật đầu khích lệ, Mai hít sâu và nói chậm lại. Bài nói không hoàn hảo, nhưng cả lớp vỗ tay. Mai hiểu rằng tự tin không phải là hết sợ, mà là vẫn bước tiếp dù còn sợ.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Bài thuyết trình run rẩy” là gì?", ["Tự tin", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p25", "level": "Vừa", "theme": "Gia đình", "title": "Ấm trà của ông", "text": "Ông thường pha trà vào mỗi sáng. Tiếng nước rót vào chén nhỏ nghe rất khẽ. Một hôm, Nam hỏi vì sao ông luôn đợi vài phút trước khi uống. Ông bảo: “Trà cần thời gian để ngấm, con người cũng vậy.” Nam chưa hiểu hết, nhưng em nhớ lời ấy mỗi khi nóng vội. Có những bài học đến từ một chén trà bình thường.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Ấm trà của ông” là gì?", ["Gia đình", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p26", "level": "Khó", "theme": "Đọc sách", "title": "Trang cuối còn mở", "text": "Tối ấy, Hà định đọc nốt chương cuối rồi ngủ. Nhưng khi gấp sách lại, em cứ nghĩ mãi về nhân vật đã dám nói lời thật. Sáng hôm sau, Hà trả sách cho thư viện và mượn thêm một cuốn khác. Em nhận ra một cuốn sách hay không kết thúc ở trang cuối; nó còn tiếp tục trong suy nghĩ của người đọc.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Trang cuối còn mở” là gì?", ["Đọc sách", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p27", "level": "Dễ", "theme": "Môi trường", "title": "Chiếc chai nhựa dưới gốc cây", "text": "Sau giờ thể dục, Tuấn thấy một chiếc chai nhựa nằm dưới gốc cây. Em định đi qua vì nghĩ không phải rác của mình. Nhưng rồi Tuấn nhớ câu cô giáo nói: “Sân trường là nhà chung.” Em nhặt chai bỏ vào thùng phân loại. Việc nhỏ ấy khiến gốc cây sạch hơn và Tuấn thấy mình cũng nhẹ lòng hơn.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Chiếc chai nhựa dưới gốc cây” là gì?", ["Môi trường", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p28", "level": "Vừa", "theme": "Lòng biết ơn", "title": "Bàn tay của mẹ", "text": "Bài tập làm văn yêu cầu tả một người thân. Hương định tả mái tóc của mẹ, nhưng rồi em nhìn thấy đôi bàn tay mẹ có vài vết xước nhỏ. Đó là bàn tay nấu cơm, giặt áo, sửa lại chiếc cặp cho em. Hương viết: “Bàn tay mẹ không mềm nhất, nhưng ấm nhất.” Câu văn ấy khiến mẹ đọc rất lâu.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Bàn tay của mẹ” là gì?", ["Lòng biết ơn", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p29", "level": "Khó", "theme": "Sáng tạo", "title": "Chiếc hộp giấy cũ", "text": "Từ chiếc hộp giấy bỏ đi, nhóm của Bảo làm thành một mô hình thư viện nhỏ. Các bạn cắt cửa sổ, vẽ giá sách và đặt những cuốn sách tí hon bằng giấy màu. Cô giáo khen vì nhóm không chỉ tái chế mà còn tưởng tượng. Bảo hiểu rằng sáng tạo nhiều khi bắt đầu từ thứ người khác định bỏ đi.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Chiếc hộp giấy cũ” là gì?", ["Sáng tạo", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p30", "level": "Dễ", "theme": "Kiên trì", "title": "Mười phút mỗi ngày", "text": "Vy học đánh đàn nhưng ngón tay thường bấm sai. Em từng muốn bỏ cuộc vì bài nhạc nghe đứt quãng. Cô giáo bảo: “Con chỉ cần mười phút thật tập trung mỗi ngày.” Một tháng sau, Vy chơi được đoạn nhạc đầu tiên trọn vẹn. Tiếng đàn còn vụng, nhưng trong đó có sự kiên trì của em.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ ức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Một cách giải khác” là gì?", ["Tư duy", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p32", "level": "Khó", "theme": "Kỷ luật", "title": "Cuốn sổ kế hoạch", "text": "Trước tuần kiểm tra, Linh lập một cuốn sổ nhỏ ghi việc cần làm mỗi ngày. Ban đầu, em thấy phiền vì phải đánh dấu từng mục. Nhưng đến cuối tuần, Linh nhận ra mình không còn học dồn vào buổi tối. Cuốn sổ không làm bài thay em, nhưng giúp em nhìn thấy con đường cần đi.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Cuốn sổ kế hoạch” là gì?", ["Kỷ luật", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p33", "level": "Dễ", "theme": "Thiên nhiên", "title": "Tiếng chim sau mưa", "text": "Sau cơn mưa đêm, khu vườn sau nhà sáng lên trong mùi đất ẩm. Từ cành khế, một con chim nhỏ hót vang. Tiếng hót trong trẻo khiến buổi sáng như được đánh thức. Minh mở cửa sổ thật khẽ, sợ làm vỡ mất âm thanh ấy. Em thấy thiên nhiên có những món quà không cần gói giấy.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Tiếng chim sau mưa” là gì?", ["Thiên nhiên", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p34", "level": "Vừa", "theme": "Trường học", "title": "Cánh cửa lớp học", "text": "Cánh cửa lớp 5C hơi kêu mỗi khi mở ra. Hằng ngày, bác bảo vệ đều tra dầu nhưng ít ai để ý. Một hôm, lớp trưởng đề nghị cả lớp viết lời cảm ơn bác. Tấm thiệp nhỏ được dán cạnh cửa. Từ đó, mỗi lần bước vào lớp, các bạn không chỉ nghe tiếng cửa êm hơn, mà còn nhớ đến người âm thầm chăm sóc trường.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đ nhỏ” là gì?", ["Quê hương", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p37", "level": "Vừa", "theme": "Công nghệ", "title": "Một ngày không màn hình", "text": "Chủ nhật, bố mẹ đề nghị cả nhà có một ngày không màn hình. Ban đầu, Sơn thấy buồn chán. Nhưng rồi em cùng bố sửa chiếc xe đạp cũ, cùng mẹ nhặt rau và đọc truyện cho em gái. Tối đến, Sơn ngạc nhiên vì ngày trôi qua rất nhanh. Em hiểu rằng thiết bị rất tiện, nhưng không nên lấy mất thời gian bên nhau.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Một ngày không màn hình” là gì?", ["Công nghệ", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p38", "level": "Khó", "theme": "Lịch sử", "title": "Tên đường em đi qua", "text": "Mỗi ngày, Huy đi học qua con đường mang tên một vị anh hùng. Trước đây, em chỉ xem đó là tấm biển màu xanh. Sau buổi học lịch sử địa phương, Huy dừng lại đọc kỹ cái tên ấy. Em thấy con đường quen thuộc bỗng có chiều sâu hơn. Một cái tên trên biển đường cũng có thể mở ra lòng biết ơn.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", "Độ dài của tên bài", "Số dấu chấm trong bài", "Cỡ chữ của văn bản"], 0, "Tính cách nhân vật bộc lộ qua hành động, lời nói, suy nghĩ."], ["Khi hỏi về thông điệp, em nên tìm gì?", ["Bài học hoặc ý nghĩa sâu hơn sau câu chuyện", "Câu đầu tiên của bài", "Từ dài nhất trong bài", "Tên nhân vật phụ"], 0, "Thông điệp thường nằm ở sự thay đổi nhận thức hoặc câu kết."], ["Cách trả lời câu hỏi mở tốt nhất là gì?", ["Nêu ý kiến rõ ràng, kèm một lí do hoặc chi tiết từ bài", "Chỉ trả lời có hoặc không", "Chép toàn bộ văn bản", "Viết thật dài nhưng không liên quan"], 0, "Câu hỏi mở cần có ý kiến và căn cứ."], ["Chủ đề gần nhất của văn bản “Tên đường em đi qua” là gì?", ["Lịch sử", "Thể thao thành tích cao", "Mua bán hàng hóa", "Trò chơi điện tử"], 0, "Chủ đề thể hiện qua sự việc trung tâm và bài học của văn bản."]]}, {"id": "p39", "level": "Dễ", "theme": "Lòng tốt", "title": "Ô cửa xe buýt", "text": "Trên xe buýt đông người, bà cụ đứng gần cửa sau. Minh đứng dậy nhường ghế. Bà mỉm cười cảm ơn, còn Minh bám vào tay vịn. Xe lắc nhẹ, nhưng em thấy vui. Một chỗ ngồi nhường đi không làm mình thiệt nhiều, nhưng có thể làm hành trình của người khác dễ chịu hơn.", "questions": [["Văn bản chủ yếu nói về điều gì?", ["Một trải nghiệm nhỏ dẫn đến bài học ý nghĩa", "Một trận thi đấu thể thao", "Một buổi mua sắm ồn ào", "Một câu chuyện không có nhân vật"], 0, "Hãy chọn ý bao quát cả văn bản, không chỉ một chi tiết."], ["Chi tiết nào thường giúp hiểu rõ nhân vật trong bài?", ["Hành động, lời nói và suy nghĩ của nhân vật", const state = JSON.parse(localStorage.getItem('bipTVStateV2')||JSON.stringify(DEFAULT_STATE));

function save(){ localStorage.setItem('bipTVStateV2', JSON.stringify(state)); renderHeader(); }
function renderHeader(){document.getElementById('points').textContent=state.points||0;document.getElementById('correctCount').textContent=state.correct||0;document.getElementById('streak').textContent=state.streak||0;document.getElementById('doneCount').textContent=(state.history||[]).length}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a}
function sample(arr,n){return shuffle(arr).slice(0,Math.min(n,arr.length))}
function prepareQuestion(q){const choices=q.choices.map((text,idx)=>({text,correct:idx===q.answer}));return {...q,choices:shuffle(choices)}}
function bySkill(skill){return DATA.questions.filter(q=>q.skill===skill)}
function bySubtype(sub){return DATA.questions.filter(q=>q.subtype===sub)}
function markDone(key){state.done[key]=(state.done[key]||0)+1;save()}
function updateSkill(skill, correct){state.skillStats=state.skillStats||{};if(!state.skillStats[skill])state.skillStats[skill]={total:0,correct:0};state.skillStats[skill].total++;if(correct)state.skillStats[skill].correct++}
function nav(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button onclick="go('${t[0]}')" class="${currentTab===t[0]?'active':''}"><span>${t[1]}</span><span class="badge">${t[2]}</span></button>`).join('')}
function go(tab){currentTab=tab;nav();render();window.scrollTo({top:0,behavior:'smooth'})}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function percent(done,total){return Math.min(100,Math.round((done/total)*100))}
function render(){const main=document.getElementById('main'); if(currentTab==="home")main.innerHTML=home(); if(currentTab==="dashboard")main.innerHTML=dashboard(); if(currentTab==="daily")main.innerHTML=daily(); if(currentTab==="topics")main.innerHTML=topics(); if(currentTab==="reading")main.innerHTML=reading(); if(currentTab==="quiz")main.innerHTML=quizHome(); if(currentTab==="writing")main.innerHTML=writing(); if(currentTab==="exam")main.innerHTML=exam(); if(currentTab==="tips")main.innerHTML=tips(); if(currentTab==="mistakes")main.innerHTML=mistakes();}
function home(){
 const m=DATA.meta; const steps=[["Khởi động 5 phút mỗi ngày","daily",state.done.daily||0,30],["Lấp lỗ hổng từ và câu","topics",state.done.vocab||0,40],["Đọc hiểu như thám tử","reading",state.done.reading||0,30],["Drill phản xạ trắc nghiệm","quiz",state.done.quiz||0,50],["Viết câu hay và đoạn văn","writing",state.writing.length||0,30],["Đề thi thử tổng hợp","exam",state.done.exam||0,15]];
 return card("Hành trang ôn thi",`<p class="lead">Bản này chuyển từ app ôn nhẹ sang hệ luyện thi có ma trận: đọc hiểu, từ vựng, từ và câu, cảm thụ, chính tả, viết đoạn, đề thi thử và sổ lỗi sai.</p>
 <div class="kpis"><div class="kpi"><b>${m.readingCount}</b><span>Bài đọc</span></div><div class="kpi"><b>${m.questionCount}</b><span>Câu hỏi</span></div><div class="kpi"><b>${m.writingCount}</b><span>Đề viết</span></div><div class="kpi"><b>${m.tipCount}</b><span>Mẹo nhớ</span></div><div class="kpi"><b>${(state.mistakes||[]).length}</b><span>Lỗi đã lưu</span></div></div>`)
